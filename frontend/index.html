    <script>
      // Apply the saved theme before first paint so the splash and initial
      // render don't flash the wrong colours. Kept in sync with theme.ts tokens.
      (function () {
        try {
          var m = localStorage.getItem('obk-theme');
          if (m !== 'light' && m !== 'dark') {
            m = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = m;
          var s = document.documentElement.style;
          s.setProperty('--obk-splash-bg', m === 'light' ? '#f6f1ec' : '#0b0709');
          s.setProperty('--obk-splash-raised', m === 'light' ? '#fffaf6' : '#150d12');
          s.setProperty('--obk-splash-core', '#10080d');
          s.setProperty('--obk-splash-mark-text', '#f4ede7');
          s.setProperty('--obk-splash-mark', m === 'light' ? '#221319' : '#f4ede7');
          s.setProperty('--obk-splash-wine', m === 'light' ? '#5f053a' : '#8e1b63');
          s.setProperty('--obk-splash-muted', m === 'light' ? '#7a6670' : '#b9aab3');
          s.setProperty('--obk-splash-border', m === 'light' ? 'rgba(95, 5, 58, 0.16)' : 'rgba(223, 169, 201, 0.14)');
          s.setProperty('--obk-splash-decor', m === 'light' ? 'rgba(95, 5, 58, 0.05)' : 'rgba(244, 237, 231, 0.05)');
        } catch (e) {}
      })();
    </script>
    <style>
      #obk-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding: 24px;
        overflow: hidden;
        background-color: var(--obk-splash-bg, #0b0709);
        background-image:
          radial-gradient(circle at 50% 42%, rgba(142, 27, 99, 0.24), transparent 34%),
          radial-gradient(circle at 18% 18%, var(--obk-splash-decor, rgba(244, 237, 231, 0.05)), transparent 28%),
          radial-gradient(circle at 84% 78%, rgba(223, 169, 201, 0.08), transparent 30%);
        transition: opacity 500ms ease, visibility 500ms ease;
        font-family: Georgia, 'Times New Roman', serif;
      }
      #obk-splash.obk-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #obk-splash::before {
        content: '';
        position: absolute;
        inset: clamp(18px, 3vw, 28px);
        border: 1px solid var(--obk-splash-border, rgba(223, 169, 201, 0.14));
        opacity: 0.72;
      }
      #obk-splash::after {
        content: '';
        position: absolute;
        width: clamp(76px, 10vw, 120px);
        height: clamp(76px, 10vw, 120px);
        right: clamp(17px, 3vw, 27px);
        bottom: clamp(17px, 3vw, 27px);
        border-right: 1px solid #dfa9c9;
        border-bottom: 1px solid #dfa9c9;
        opacity: 0.45;
      }
      #obk-splash .obk-card {
        position: relative;
        z-index: 1;
        width: min(100%, 520px);
        display: grid;
        justify-items: center;
        gap: clamp(20px, 3vw, 28px);
        text-align: center;
        animation: obk-splash-rise 900ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      #obk-splash .obk-card::before {
        content: '';
        position: absolute;
        width: clamp(76px, 10vw, 120px);
        height: clamp(76px, 10vw, 120px);
        left: calc(clamp(18px, 3vw, 28px) * -1);
        top: calc(clamp(18px, 3vw, 28px) * -1);
        border-left: 1px solid #dfa9c9;
        border-top: 1px solid #dfa9c9;
        opacity: 0.45;
      }
      #obk-splash .obk-logo {
        width: min(64%, 270px);
        height: auto;
        overflow: visible;
        filter: drop-shadow(0 28px 70px rgba(11, 7, 9, 0.32));
      }
      #obk-splash .obk-logo__iris {
        transform-origin: 36px 36px;
        animation: obk-logo-iris 5.8s ease-in-out infinite;
      }
      #obk-splash .obk-logo__draw {
        stroke-dasharray: 210;
        animation: obk-logo-draw 1.4s cubic-bezier(.16, 1, .3, 1) both;
      }
      #obk-splash .obk-logo__glint {
        stroke-dasharray: 28;
        animation: obk-logo-glint 3.2s ease-in-out infinite;
      }
      #obk-splash .obk-tagline {
        color: #dfa9c9;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 0.72rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        margin-top: -6px;
      }
      #obk-splash .obk-bar {
        position: relative;
        width: min(100%, 320px);
        height: 3px;
        background: rgba(244, 237, 231, 0.12);
        overflow: hidden;
      }
      #obk-splash .obk-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 36%;
        background: linear-gradient(90deg, #5f053a, #8e1b63, #dfa9c9);
        animation: obk-splash-track 1.35s ease-in-out infinite;
      }
      #obk-splash .obk-steps {
        width: min(100%, 320px);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: -12px 0 0;
        color: var(--obk-splash-muted, #b9aab3);
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #obk-splash .obk-steps span:nth-child(2) {
        color: #dfa9c9;
      }
      @keyframes obk-splash-shimmer {
        0% { background-position: 150% 0; }
        100% { background-position: -150% 0; }
      }
      @keyframes obk-logo-iris {
        0%, 100% { transform: rotate(0deg) scale(1); opacity: .82; }
        45% { transform: rotate(8deg) scale(1.03); opacity: 1; }
      }
      @keyframes obk-logo-draw {
        from { stroke-dashoffset: 210; opacity: .2; }
        to { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes obk-logo-glint {
        0%, 58%, 100% { stroke-dashoffset: 28; opacity: .15; }
        72% { stroke-dashoffset: 0; opacity: .95; }
      }
      @keyframes obk-splash-track {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @keyframes obk-splash-breathe {
        0%, 100% { transform: scale(1) rotate(0deg); }
        50% { transform: scale(1.04) rotate(1deg); }
      }
      @keyframes obk-splash-rise {
        from {
          opacity: 0;
          filter: blur(8px);
          transform: perspective(1100px) translate3d(0, 44px, -54px) rotateX(12deg) scale(0.96);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: perspective(1100px) translate3d(0, 0, 0) rotateX(0deg) scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #obk-splash .obk-mark,
        #obk-splash .obk-logo__iris,
        #obk-splash .obk-logo__draw,
        #obk-splash .obk-logo__glint,
        #obk-splash .obk-bar::after,
        #obk-splash .obk-tile,
        #obk-splash .obk-card { animation: none; }
      }
    </style>
