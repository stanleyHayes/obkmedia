<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0709" />
    <title>OBK MEDIA — The Master's Touch You Need | Wedding Photography Kumasi</title>
    <meta
      name="description"
      content="OBK MEDIA is a professional photography and visual storytelling brand in Kumasi, Ghana — weddings, portraits, events, fashion, and cinematic productions, nationwide."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "https://obkmedia.com",
        "name": "OBK MEDIA",
        "slogan": "The Master's Touch You Need",
        "description": "Professional photography and videography brand capturing weddings, portraits, events, fashion, and cinematic productions across Ghana.",
        "email": "Obkmedia30@gmail.com",
        "telephone": "+233546175921",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Abuakwa-Nkawie",
          "addressRegion": "Ashanti Region",
          "addressCountry": "GH"
        },
        "areaServed": "Ghana",
        "openingHours": "Mo-Su 00:00-24:00",
        "knowsAbout": ["Wedding Photography", "Portrait Photography", "Event Photography", "Wedding Videography"],
        "sameAs": [
          "https://www.tiktok.com/@obkmedia",
          "https://www.youtube.com/channel/UCKc_qTRt39Dx6XrVf9maJnA"
        ]
      }
    </script>
  </head>
  <body>
    <script>
      // Apply the saved theme before first paint so the splash and initial
      // render don't flash the wrong colours. Kept in sync with theme.ts tokens.
      (function () {
        try {
          var m = localStorage.getItem('obk-theme');
          if (m !== 'light' && m !== 'dark') {
            m = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = m;
          var s = document.documentElement.style;
          s.setProperty('--obk-splash-bg', m === 'light' ? '#f6f1ec' : '#0b0709');
          s.setProperty('--obk-splash-mark', m === 'light' ? '#221319' : '#f4ede7');
        } catch (e) {}
      })();
    </script>
    <style>
      #obk-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background-color: var(--obk-splash-bg, #0b0709);
        background-image: radial-gradient(ellipse at 50% 40%, rgba(95, 5, 58, 0.3), transparent 60%);
        transition: opacity 500ms ease, visibility 500ms ease;
        font-family: Georgia, 'Times New Roman', serif;
      }
      #obk-splash.obk-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #obk-splash .obk-mark {
        font-weight: 600;
        font-size: clamp(2.2rem, 7vw, 3.4rem);
        letter-spacing: 0.18em;
        color: var(--obk-splash-mark, #f4ede7);
        background: linear-gradient(100deg, var(--obk-splash-mark, #f4ede7) 30%, #b9468f 50%, var(--obk-splash-mark, #f4ede7) 70%);
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: obk-splash-shimmer 2s ease-in-out infinite;
      }
      #obk-splash .obk-mark em {
        font-style: italic;
      }
      #obk-splash .obk-bar {
        position: relative;
        width: 160px;
        height: 2px;
        background: rgba(244, 237, 231, 0.12);
        overflow: hidden;
      }
      #obk-splash .obk-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        background: #8e1b63;
        animation: obk-splash-track 1.4s ease-in-out infinite;
      }
      @keyframes obk-splash-shimmer {
        0% { background-position: 150% 0; }
        100% { background-position: -150% 0; }
      }
      @keyframes obk-splash-track {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #obk-splash .obk-mark,
        #obk-splash .obk-bar::after { animation: none; }
      }
    </style>
    <div id="obk-splash" role="status" aria-label="Loading OBK MEDIA">
      <div class="obk-mark">OBK <em>MEDIA</em></div>
      <div class="obk-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
