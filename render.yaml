# Render Blueprint — deploys the OBK MEDIA API as a web service.
# The frontend deploys separately on Vercel (root directory: frontend/),
# which proxies /api and /uploads to this service — see frontend/vercel.json.
# NOTE: the service name below determines the URL (obkmedia-api.onrender.com);
# if you rename it, update the rewrite destinations in frontend/vercel.json.
services:
  - type: web
    name: obkmedia-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false # comma-separated, e.g. https://obkmedia.vercel.app,https://www.obkmedia.com
      - key: ADMIN_EMAIL
        sync: false # bootstrap admin login
      - key: ADMIN_PASSWORD
        sync: false # bootstrap admin password — set a strong one; first login forces a reset
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # strongly recommended: Render's disk is ephemeral, local uploads vanish on restart
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false # optional — email falls back to console logging when unset
      - key: CONTACT_NOTIFY_EMAIL
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
